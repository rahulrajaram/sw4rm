{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sw4rm-reference-services.fullname" $ }}-{{ $name }}
  labels:
    {{- include "sw4rm-reference-services.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $svc.service.type | default $.Values.service.type }}
  selector:
    {{- include "sw4rm-reference-services.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: grpc
      protocol: TCP
      port: {{ $svc.port }}
      targetPort: grpc
    {{- if $svc.metrics_port }}
    - name: metrics
      protocol: TCP
      port: {{ $svc.metrics_port }}
      targetPort: metrics
    {{- end }}
{{- end }}
{{- end }}

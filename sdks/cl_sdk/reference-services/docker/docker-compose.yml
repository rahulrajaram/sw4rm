version: '3.8'

# SW4RM Common Lisp Reference Services
#
# Usage:
#   docker-compose up --build
#
# Environment Variables:
#   REGISTRY_PORT     - Registry service port (default: 50052)
#   ROUTER_PORT       - Router service port (default: 50051)
#   SCHEDULER_PORT    - Scheduler service port (default: 50053)
#   COORDINATION_PORT - Coordination server port (default: 50060)

services:
  registry:
    build:
      context: ../../..
      dockerfile: sdks/cl_sdk/reference-services/docker/Dockerfile.registry
    ports:
      - "${REGISTRY_PORT:-50052}:50052"
    environment:
      - REGISTRY_PORT=50052
    networks:
      - sw4rm-lisp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' | nc -z localhost 50052"]
      interval: 10s
      timeout: 5s
      retries: 3

  router:
    build:
      context: ../../..
      dockerfile: sdks/cl_sdk/reference-services/docker/Dockerfile.router
    ports:
      - "${ROUTER_PORT:-50051}:50051"
    environment:
      - ROUTER_PORT=50051
    networks:
      - sw4rm-lisp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' | nc -z localhost 50051"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: ../../..
      dockerfile: sdks/cl_sdk/reference-services/docker/Dockerfile.scheduler
    ports:
      - "${SCHEDULER_PORT:-50053}:50053"
    environment:
      - SCHEDULER_PORT=50053
      - REGISTRY_HOST=registry
      - REGISTRY_PORT=50052
      - ROUTER_HOST=router
      - ROUTER_PORT=50051
    depends_on:
      registry:
        condition: service_healthy
      router:
        condition: service_healthy
    networks:
      - sw4rm-lisp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' | nc -z localhost 50053"]
      interval: 10s
      timeout: 5s
      retries: 3

  coordination:
    build:
      context: ../../..
      dockerfile: sdks/cl_sdk/reference-services/docker/Dockerfile.coordination
    ports:
      - "${COORDINATION_PORT:-50060}:50060"
    environment:
      - COORDINATION_PORT=50060
    networks:
      - sw4rm-lisp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' | nc -z localhost 50060"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  sw4rm-lisp:
    driver: bridge

[package]
name = "sw4rm-sdk"
version = "0.1.0"
edition = "2021"
description = "SW4RM Agentic Protocol - Reference Rust SDK"
license = "MIT"
repository = "https://github.com/rahulrajaram/sw4rm"
keywords = ["grpc", "agents", "distributed", "protocol"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.12", features = ["gzip", "tls"] }
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
dashmap = "6.0"
directories = "5.0"
# Optional OS keyring support
keyring = { version = "2.3", optional = true }

# Additional dependencies for new features
tower = "0.4"
tower-layer = "0.3"
pin-project-lite = "0.2"
tokio-stream = "0.1"
mockall = { version = "0.12", optional = true }

# Protobuf build dependencies
[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
futures = "0.3"

[features]
default = ["proto"]
proto = []
testing = ["mockall"]
keyring = ["dep:keyring"]

[[bench]]
name = "performance_benchmarks"
harness = false

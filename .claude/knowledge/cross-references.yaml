# Bidirectional link requirements
# If A links to B, B should link back to A (for navigation)
bidirectional_links:
  - from: documentation/index.md
    to: documentation/protocol/spec.md
    expected_backlink: true
  - from: documentation/quickstart/index.md
    to: documentation/protocol/messages.md
    expected_backlink: true
  - from: documentation/examples/index.md
    to: sdks/py_sdk/examples/
    expected_backlink: true

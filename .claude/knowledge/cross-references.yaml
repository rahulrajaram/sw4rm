# SW4RM Documentation Cross-References
# =====================================
# This file maps relationships between documentation sources.
# Used by swarm-knowledge-guardian to detect contradictions
# and ensure consistency across the knowledge base.
#
# Relationship types:
# - authoritative: Source A is the authority; others must conform
# - implements: Code implements what docs specify
# - explains: User docs explain what spec defines
# - examples: Code examples of documented concepts
# - contradicts: Known contradictions (should be empty!)
#
# Last Updated: 2026-01-03T18:00:00Z (Second Audit)

# Authoritative hierarchy (higher wins in conflicts)
authority_hierarchy:
  1: protos/           # Proto definitions are ground truth for structure
  2: documentation/protocol/spec.md  # Spec is ground truth for behavior
  3: documentation/protocol/         # Protocol docs explain spec
  4: documentation/                  # User docs simplify protocol docs
  5: sdks/*/README.md               # SDK docs must match user docs
  6: sdks/*/examples/               # Examples must match SDK docs

# Concept-to-source mappings
# Each concept lists where it's defined and where it's used
concepts:
  envelope_structure:
    authoritative: protos/common.proto  # CORRECTED: Envelope is in common.proto
    explained_in:
      - documentation/protocol/spec.md#section-3.3
      - documentation/protocol/messages.md
    implemented_in:
      - sdks/py_sdk/sw4rm/envelope.py
      - sdks/rust_sdk/src/envelope.rs
      - sdks/js_sdk/src/types/envelope.ts
    examples_in:
      - sdks/py_sdk/examples/echo_agent.py
    verification_points:
      - "Field order must match proto"
      - "Field types must match proto"
      - "Required vs optional must match"

  three_id_model:
    authoritative: documentation/protocol/spec.md#section-3.3
    explained_in:
      - documentation/protocol/advanced-patterns.md#three-id
      - documentation/quickstart/persistence.md
    implemented_in:
      - sdks/py_sdk/sw4rm/activity_buffer.py
      - sdks/rust_sdk/src/activity_buffer.rs
    examples_in:
      - sdks/py_sdk/examples/three_id_demo.py
    verification_points:
      - "message_id: UUIDv4, unique per attempt"
      - "idempotency_token: stable across retries"
      - "correlation_id: links request/response"
      - "dedup_window_s default: 3600 (1 hour)"

  ack_lifecycle:
    authoritative: protos/common.proto  # CORRECTED: Proto is authoritative for stages
    explained_in:
      - documentation/protocol/acks.md
      - documentation/protocol/spec.md#section-11
    implemented_in:
      - sdks/py_sdk/sw4rm/ack_integration.py
      - sdks/py_sdk/sw4rm/acks.py
    examples_in:
      - sdks/py_sdk/examples/echo_agent.py
    verification_points:
      - "Stages: RECEIVED -> READ -> FULFILLED|REJECTED|FAILED|TIMED_OUT"  # CORRECTED
      - "No PROCESSING stage exists in proto"  # ADDED
      - "NACK triggers retry or DLQ"
      - "Reconciliation finds unacked messages"

  service_ports:
    authoritative: sdks/py_sdk/reference-services/  # Code is source of truth
    also_in:
      - documentation/index.md
      - documentation/protocol/services.md
      - documentation/architecture/index.md
    implemented_in:
      - sdks/py_sdk/sw4rm/config.py (Endpoints class)
      - sdks/py_sdk/sw4rm/constants.py
      - sdks/py_sdk/reference-services/hive/registry_service.py
      - sdks/py_sdk/reference-services/hive/router_service.py
    verification_points:
      - "Router: 50051"      # Verified against reference-services
      - "Registry: 50052"    # Verified against reference-services
      - "Scheduler: 50053"
      - "HITL: 50061"
      - "Worktree: 50062"
      - "Tools: 50063"
      - "Negotiation: 50064"
      - "Reasoning: 50065"
      - "Logging: 50066"
      - "Connector: 50067"

  negotiation_room:
    authoritative: documentation/protocol/spec.md#section-17.5
    explained_in:
      - documentation/protocol/advanced-patterns.md
    implemented_in:
      - sdks/py_sdk/sw4rm/negotiation_coordinator.py
      - protos/negotiation_room.proto
    examples_in:
      - sdks/py_sdk/examples/negotiation_debate_example.py
    verification_points:
      - "Roles: producer, critic, coordinator"
      - "Voting is confidence-weighted"
      - "Uses correlation_id = negotiation_id"

  handoff:
    authoritative: documentation/protocol/spec.md#section-17.6
    explained_in:
      - documentation/protocol/advanced-patterns.md
    implemented_in:
      - sdks/py_sdk/sw4rm/handoff/
      - protos/handoff.proto
    examples_in:
      - sdks/py_sdk/examples/handoff_example.py
    verification_points:
      - "States: PENDING -> ACCEPTED|REJECTED -> COMPLETED|EXPIRED"  # CORRECTED per proto
      - "Capability matching required"
      - "Context transfer included"

  workflow:
    authoritative: documentation/protocol/spec.md#section-17.7
    explained_in:
      - documentation/protocol/advanced-patterns.md
    implemented_in:
      - sdks/py_sdk/sw4rm/workflow/
      - protos/workflow.proto
    examples_in:
      - sdks/py_sdk/examples/workflow_orchestration_example.py
    verification_points:
      - "DAG structure for step dependencies"
      - "Step states track individual progress"
      - "Workflow state aggregates step states"

  agent_lifecycle:
    authoritative: documentation/protocol/spec.md#section-8
    explained_in:
      - documentation/quickstart/first-agent.md
    implemented_in:
      - sdks/py_sdk/sw4rm/runtime/agent.py
    verification_points:
      - "12 states in state machine"
      - "INITIALIZING -> RUNNABLE -> SCHEDULED -> RUNNING"
      - "Clean shutdown: SHUTTING_DOWN"
      - "Recovery from FAILED possible"

  persistence:
    authoritative: documentation/quickstart/persistence.md
    implemented_in:
      - sdks/py_sdk/sw4rm/persistence.py
    examples_in:
      - sdks/py_sdk/examples/three_id_demo.py
    verification_points:
      - "PersistenceBackend is the interface"
      - "JSONFilePersistence is default"
      - "Atomic writes via temp file + rename"
      - "Base64 for binary payloads"


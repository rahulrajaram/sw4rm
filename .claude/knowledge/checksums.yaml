# SW4RM Knowledge Source Checksums
# ==================================
# This file tracks content hashes of knowledge sources.
# The swarm-knowledge-guardian uses this to detect when
# sources have changed since last analysis, enabling
# incremental audits instead of full re-reads.
#
# Algorithm: SHA-256 (first 16 chars for readability)
#
# Workflow:
# 1. Guardian loads checksums at start
# 2. Computes current hash for files it needs to verify
# 3. If hash matches, uses cached summary instead of full read
# 4. If hash differs, re-reads source and updates summary
# 5. Updates checksums.yaml at end of session
#
# Last Updated: 2026-01-03T18:00:00Z (Second Audit)


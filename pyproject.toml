[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigagent-sdk"
version = "0.1.0"
description = "AgentOS Python SDK (experimental)"
readme = "CONTEXT.md"
requires-python = ">=3.9"
authors = [{ name = "AgentOS Devs" }]
dependencies = [
  "protobuf>=4.23,<5",
  "grpcio>=1.56,<2",
  "googleapis-common-protos>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.56,<2",
]

[project.urls]
Homepage = "https://example.com/sigagent"
Source = "https://example.com/sigagent/repo"

[tool.setuptools]
package-dir = {"" = "py_sdk"}

[tool.setuptools.packages.find]
where = ["py_sdk"]
include = ["sigagent*"]

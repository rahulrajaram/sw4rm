[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigagent-sdk"
version = "0.1.0"
description = "AgentOS Python SDK (experimental)"
readme = "CONTEXT.md"
requires-python = ">=3.9"
authors = [{ name = "AgentOS Devs" }]
dependencies = [
  "protobuf>=4.23,<5",
  "grpcio>=1.56,<2",
  "googleapis-common-protos>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.56,<2",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.4.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.0",
  "mkdocs-section-index>=0.3.0",
  "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://example.com/sigagent"
Source = "https://example.com/sigagent/repo"

[tool.setuptools]
package-dir = {"" = "py_sdk"}

[tool.setuptools.packages.find]
where = ["py_sdk"]
include = ["sigagent*"]

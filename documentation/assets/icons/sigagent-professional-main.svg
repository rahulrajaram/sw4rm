<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser Window - Clean and Professional -->
  <rect x="30" y="40" width="140" height="100" rx="12" fill="white" stroke="#2d3748" stroke-width="3"/>
  <!-- Browser Chrome -->
  <rect x="30" y="40" width="140" height="24" rx="12" fill="#2d3748"/>
  <!-- Window Controls -->
  <circle cx="42" cy="52" r="3" fill="white" opacity="0.8"/>
  <circle cx="54" cy="52" r="3" fill="white" opacity="0.8"/>
  <circle cx="66" cy="52" r="3" fill="white" opacity="0.8"/>
  
  <!-- Code Content Area -->
  <rect x="40" y="74" width="120" height="56" rx="4" fill="#f7fafc"/>
  
  <!-- Code Elements - Clean and Readable -->
  <path d="M50 85 L45 90 L50 95" stroke="#4a5568" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 85 L65 90 L60 95" stroke="#4a5568" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="55" y1="82" x2="55" y2="98" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Additional Code Lines -->
  <rect x="75" y="84" width="30" height="2.5" rx="1.25" fill="#a0aec0"/>
  <rect x="75" y="90" width="45" height="2.5" rx="1.25" fill="#a0aec0"/>
  <rect x="75" y="96" width="25" height="2.5" rx="1.25" fill="#a0aec0"/>
  
  <!-- Professional Robot/Agent -->
  <g transform="translate(85, 50)">
    <!-- Robot Body -->
    <rect x="0" y="20" width="30" height="35" rx="8" fill="#2d3748"/>
    <!-- Robot Head -->
    <rect x="5" y="0" width="20" height="25" rx="6" fill="#2d3748"/>
    <!-- Eyes -->
    <circle cx="10" cy="10" r="2.5" fill="white"/>
    <circle cx="20" cy="10" r="2.5" fill="white"/>
    <!-- Eye pupils -->
    <circle cx="10" cy="10" r="1" fill="#2d3748"/>
    <circle cx="20" cy="10" r="1" fill="#2d3748"/>
    <!-- Antenna -->
    <line x1="15" y1="0" x2="15" y2="-8" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="-8" r="2" fill="#4a5568"/>
    <!-- Arms -->
    <rect x="-5" y="25" width="8" height="15" rx="4" fill="#2d3748"/>
    <rect x="27" y="25" width="8" height="15" rx="4" fill="#2d3748"/>
    <!-- Chest Panel -->
    <rect x="8" y="28" width="14" height="8" rx="2" fill="#4a5568"/>
    <!-- Chest Detail -->
    <rect x="10" y="30" width="10" height="1.5" rx="0.75" fill="white" opacity="0.8"/>
    <rect x="10" y="33" width="10" height="1.5" rx="0.75" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Network Nodes - Professional and Clean -->
  <g stroke="#4a5568" stroke-width="2" fill="#2d3748">
    <!-- Main network cluster -->
    <circle cx="160" cy="70" r="6"/>
    <circle cx="180" cy="85" r="6"/>
    <circle cx="165" cy="105" r="6"/>
    <circle cx="145" cy="95" r="5"/>
    
    <!-- Connection lines -->
    <line x1="160" y1="76" x2="165" y2="99" stroke="#4a5568" stroke-width="2"/>
    <line x1="166" y1="70" x2="174" y2="85" stroke="#4a5568" stroke-width="2"/>
    <line x1="174" y1="85" x2="165" y2="99" stroke="#4a5568" stroke-width="2"/>
    <line x1="154" y1="70" x2="150" y2="95" stroke="#4a5568" stroke-width="2"/>
    <line x1="150" y1="95" x2="159" y2="105" stroke="#4a5568" stroke-width="2"/>
  </g>
  
  <!-- Connection from robot to network -->
  <path d="M115 67 Q135 60 155 67" stroke="#4a5568" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.6"/>
</svg>
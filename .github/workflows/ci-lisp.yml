name: Common Lisp CI

on:
  push:
  pull_request:

jobs:
  lisp:
    name: SBCL Tests
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Common Lisp
        uses: 40ants/setup-lisp@v4

      - name: Prepare the SDK native transport runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare existing Python SDK dependencies for wire checks
        run: |
          python -m pip install -e ".[dev]"
          python scripts/smoke_protos.py

      - name: Install dependencies
        working-directory: sdks/cl_sdk
        run: |
          ros run --non-interactive \
               --eval '(push (truename ".") asdf:*central-registry*)' \
               --eval '(ql:quickload :sw4rm-sdk :silent t)' \
               --eval '(format t "~%Dependencies installed successfully~%")'

      - name: Run tests with every canonical RPC over native gRPC
        run: |
          python tests/sdk_parity/with_wire_server.py -- ros run --non-interactive \
               --eval '(push (truename "sdks/cl_sdk/") asdf:*central-registry*)' \
               --eval '(ql:quickload :sw4rm-sdk :silent t)' \
               --eval '(ql:quickload :fiveam :silent t)' \
               --eval '(asdf:test-system :sw4rm-sdk)'

      - name: Verify examples load
        working-directory: sdks/cl_sdk
        run: |
          ros run --non-interactive \
               --eval '(push (truename ".") asdf:*central-registry*)' \
               --eval '(ql:quickload :sw4rm-sdk :silent t)' \
               --eval '(load "examples/echo-agent.lisp")' \
               --eval '(load "examples/negotiation-voting.lisp")' \
               --eval '(load "examples/secret-management.lisp")' \
               --eval '(format t "~%All examples loaded successfully~%")' \
               --eval '(uiop:quit 0)'

name: JS CI

on:
  push:
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/js_sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdks/js_sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdks/js_sdk
        run: |
          npm run build
          npm run check:artifact

      - name: Setup Python for cross-SDK wire checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Python reference router bindings
        run: |
          python -m pip install -e ".[dev]"
          python scripts/smoke_protos.py

      - name: Run JS tests
        working-directory: sdks/js_sdk
        run: npm test --silent

name: Examples SDK Usage (Ack Demo)

on:
  push:
    paths:
      - 'examples/sdk-usage/**'
      - 'examples/reference-services/js/**'
      - 'sdks/js_sdk/**'
      - 'protos/**'
      - '.github/workflows/examples-sdk-usage.yml'
  pull_request:
    paths:
      - 'examples/sdk-usage/**'
      - 'examples/reference-services/js/**'
      - 'sdks/js_sdk/**'
      - 'protos/**'
      - '.github/workflows/examples-sdk-usage.yml'

jobs:
  ack-demo-js:
    name: JS ACK Demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/js_sdk/package-lock.json

      - name: Install SDK deps
        working-directory: sdks/js_sdk
        run: npm ci

      - name: Install JS reference-service deps
        working-directory: examples/reference-services/js
        run: npm ci

      - name: Run ACK demo (examples/sdk-usage)
        env:
          # Default addresses used by scripts; override here if needed
          SW4RM_ROUTER_ADDR: localhost:50051
          SW4RM_REGISTRY_ADDR: localhost:50052
          SW4RM_SCHEDULER_ADDR: localhost:50053
        run: |
          bash examples/sdk-usage/run_all.sh ack-demo


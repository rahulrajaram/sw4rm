name: Version Guard

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check-versions:
    name: Enforce spec + SDK version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check all five SDKs and generated release documentation
        run: python3 scripts/release_contract.py --base-ref "origin/${{ github.base_ref }}"

  preflight-build:
    name: Preflight build (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python build
        run: |
          python -m pip install -e ".[dev]"
          python scripts/smoke_protos.py
          python -m build
          python scripts/check_python_artifact.py dist/*.whl
          twine check dist/*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS build
        working-directory: sdks/js_sdk
        run: |
          npm ci
          npm run build
          npm run check:artifact

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust package dry-run
        run: |
          cargo package --manifest-path sdks/rust_sdk/Cargo.toml

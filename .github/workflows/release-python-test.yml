name: Release Python (TestPyPI)

on:
  push:
    tags:
      - "py-test-v*"

permissions:
  contents: read

jobs:
  build-and-publish-testpypi:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#py-test-v}"
          echo "tag_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version matches pyproject.toml
        run: |
          FILE_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version: ${{ steps.vars.outputs.tag_version }}"
          echo "File version: $FILE_VERSION"
          if [ "$FILE_VERSION" != "${{ steps.vars.outputs.tag_version }}" ]; then
            echo "Version mismatch: tag ${{ steps.vars.outputs.tag_version }} vs pyproject $FILE_VERSION" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/**


name: Python CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dev dependencies
        run: |
          python -m pip install -e ".[dev,test]"

      - name: Install SBCL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Run smoke test (protos + imports)
        run: |
          python scripts/smoke_protos.py

      - name: Run Python unit tests
        run: |
          pytest -q sdks/py_sdk/tests

      - name: Run crash-conformance harness checks
        run: |
          timeout 180 python -m pytest -q tests/crash_conformance

      - name: Record all six crash-conformance outcomes
        if: always()
        run: |
          timeout 120 python tests/crash_conformance/run_scenarios.py \
            --scorecard artifacts/crash-conformance/crash_scorecard.json

      - name: Upload crash-conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-conformance-evidence
          path: artifacts/crash-conformance/
          if-no-files-found: error

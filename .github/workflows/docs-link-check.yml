name: Docs Build & Link Check

on:
  pull_request:
    paths:
      - 'documentation/**'
      - 'README.md'
      - 'sdks/**'
      - 'protos/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - '.lychee.toml'
  push:
    branches: [ main, master ]
    paths:
      - 'documentation/**'
      - 'README.md'
      - 'sdks/**'
      - 'protos/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - '.lychee.toml'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared documentation and development dependencies
        run: python -m pip install -e ".[dev,test,docs]"

      - name: Check documentation against source
        run: |
          python scripts/smoke_protos.py
          python scripts/release_contract.py
          python scripts/generate_sdk_wire_contract.py
          python scripts/check_documentation.py
          python -m pytest -q tests/release tests/documentation

      - name: Build docs (strict)
        run: |
          mkdocs build --strict

      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --config .lychee.toml .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Secret Scan

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (pinned image)
        # Pin to a specific container digest for supply-chain security.
        # Digest observed from prior successful pulls; update periodically.
        uses: docker://ghcr.io/trufflesecurity/trufflehog@sha256:214da7bcbf60f71db229bc5b6d790bf46eb1e8d068faa59838c1dba59738bc85
        with:
          args: >-
            filesystem
            --path .
            --only-verified
            --exclude-paths .trufflehog_exclude.txt

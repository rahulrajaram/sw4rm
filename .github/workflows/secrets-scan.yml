name: Secret Scan

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # SECURITY: Pin this to a specific commit SHA before merging to main.
        # Example (replace with a real commit):
        # uses: trufflesecurity/trufflehog@<commit-sha>
        # Using @main as a temporary fallback due to earlier tag resolution issue.
        uses: trufflesecurity/trufflehog@main
        with:
          scan: filesystem
          path: .
          extra_args: >-
            --only-verified
            --exclude-paths .trufflehog_exclude.txt

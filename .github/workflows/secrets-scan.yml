name: Secret Scan

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # Note: using @main to unblock CI due to tag resolution issues with @v3.
        # Consider pinning to a specific commit SHA for supply-chain security.
        uses: trufflesecurity/trufflehog@main
        with:
          scan: filesystem
          path: .
          extra_args: >-
            --only-verified
            --exclude-paths .trufflehog_exclude.txt

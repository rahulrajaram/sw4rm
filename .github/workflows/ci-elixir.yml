name: Elixir CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26'
          elixir-version: '1.16'
      - uses: actions/cache@v4
        with:
          path: |
            sdks/ex_sdk/deps
            sdks/ex_sdk/_build
          key: mix-${{ hashFiles('sdks/ex_sdk/mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
        working-directory: sdks/ex_sdk
      - run: mix deps.get
        working-directory: sdks/ex_sdk
      - run: mix compile --warnings-as-errors
        working-directory: sdks/ex_sdk
      - run: mix format --check-formatted
        working-directory: sdks/ex_sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Python reference router for cross-SDK wire checks
        run: |
          python -m pip install -e ".[dev]"
          python scripts/smoke_protos.py
      - name: Run tests with canonical RPC fixture
        run: python tests/sdk_parity/with_wire_server.py -- sh -c 'cd sdks/ex_sdk && mix test'
        env:
          SW4RM_RUN_REFERENCE_INTEGRATION: '1'
      - run: mix run examples/reference_demo.exs
        working-directory: sdks/ex_sdk

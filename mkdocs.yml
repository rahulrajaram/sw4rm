site_name: SW4RM Agentic Protocol
site_description: Open agentic protocol with a reference Python SDK
site_author: SW4RM Team
site_url: https://sw4rm.ai

docs_dir: documentation

# Repo is private for now; update when public
repo_name: sw4rm/sw4rm-sdk
repo_url: https://github.com/sw4rm/sw4rm-sdk

theme:
  name: material
  logo: assets/icons/sw4rm-logo.svg
  favicon: assets/icons/sw4rm-favicon.svg
  palette:
    - scheme: slate
      primary: blue grey
      accent: yellow
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - section-index
  - kroki

nav:
  - Home: index.md
  - Getting Started:
    - quickstart/index.md
    - Installation: quickstart/installation.md
    - Your First Agent: quickstart/first-agent.md
  - Protocol Specification:
    - protocol/index.md
    - Message Types: protocol/messages.md
    - Services: protocol/services.md
    - ACK Lifecycle: protocol/acks.md
  - Examples:
    - examples/index.md
    - Use Cases: examples/use-cases.md
    - Deployment Patterns: examples/deployment.md
  - Architecture:
    - architecture/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sw4rm/sw4rm-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sw4rm-sdk/

extra_css:
  - assets/custom.css

extra_javascript:
  - assets/collapse-mobile-nav.js

copyright: Copyright &copy; 2024 SW4RM Team

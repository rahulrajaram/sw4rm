site_name: SW4RM Agentic Protocol
site_description: Open agentic protocol with SDKs for Python, Rust, JavaScript, and Common Lisp
site_author: SW4RM Team
site_url: https://sw4rm.ai

docs_dir: documentation

# Repo is private for now; update when public
repo_name: rahulrajaram/sw4rm
repo_url: https://github.com/rahulrajaram/sw4rm

theme:
  name: material
  logo: assets/icons/sw4rm-logo.svg
  favicon: assets/icons/sw4rm-favicon.svg
  custom_dir: documentation/overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - kroki
  # Enable after installing: pip install mkdocs-htmlproofer-plugin
  # - htmlproofer:
# check_external: false
# anchor_char: "#"
# raise_error: true

# Exclude docs that conflict with index
exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Overview: overview.md
  - Getting Started:
    - quickstart/index.md
    - Installation: quickstart/installation.md
    - Your First Agent: quickstart/first-agent.md
  - Protocol Specification:
    - protocol/index.md
    - Message Types: protocol/messages.md
    - Services: protocol/services.md
    - ACK Lifecycle: protocol/acks.md
    - Activity Buffer: protocol/activity-buffer.md
    - Voting Strategies: protocol/voting-strategies.md
    - Content Types: protocol/content-types.md
    - Handoff Serialization: protocol/handoff-serialization.md
    - Protocol Extensions: protocol/extensions/index.md
    - Spec Enhancements (Draft): protocol/spec_enhancements.md
  - Examples:
    - examples/index.md
    - Use Cases: examples/use-cases.md
    - Deployment Patterns: examples/deployment.md
  - Architecture:
    - architecture/index.md
    - State Machines: architecture/state-machines.md
  - SDK Clients:
    - clients/index.md
    - Router Client: clients/router.md
    - Registry Client: clients/registry.md
    - Scheduler Client: clients/scheduler.md
    - Activity Client: clients/activity.md
    - Connector Client: clients/connector.md
    - Reasoning Client: clients/reasoning.md
    - Scheduler Policy Client: clients/scheduler-policy.md
    - Logging Client: clients/logging.md
    - Handoff Client: clients/handoff.md
    - HITL Client: clients/hitl.md
    - Negotiation Client: clients/negotiation.md
    - Negotiation Room Client: clients/negotiation-room.md
    - Tool Client: clients/tool.md
    - Workflow Client: clients/workflow.md
    - Workflow Engine: clients/workflow-engine.md
    - Worktree Client: clients/worktree.md
    - Policy Store: clients/policy-store.md
    - Shared Context Manager: clients/shared-context.md
    - Exceptions: clients/exceptions.md
    - Error Handling: clients/error-handling.md
  - Migration:
    - Deprecations: migration/deprecations.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rahulrajaram/sw4rm
    - icon: fontawesome/brands/python
      link: https://pypi.org/rahulrajaram/sw4rm-sdk

extra_css:
  - assets/empirescale.css

extra_javascript:
  - assets/collapse-mobile-nav.js
  - assets/diagram-fullscreen.js

copyright: Copyright &copy; 2025 SW4RM Team

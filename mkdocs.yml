site_name: SigAgent SDK
site_description: Production-ready SDK for building message-driven agents
site_author: SigAgent Team
site_url: https://sigagent.dev

docs_dir: documentation

repo_name: sigagent/sigagent-sdk
repo_url: https://github.com/sigagent/sigagent-sdk

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - section-index

nav:
  - Home: index.md
  - Getting Started:
    - quickstart/index.md
    - Installation: quickstart/installation.md
    - Your First Agent: quickstart/first-agent.md
  - Examples:
    - examples/index.md
  - Architecture:
    - architecture/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sigagent/sigagent-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sigagent-sdk/

copyright: Copyright &copy; 2024 SigAgent Team